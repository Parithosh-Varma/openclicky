name: Build Mac app (unsigned)

on:
  push:
    branches: [cartesia-groq-local]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release (no signing)
        run: |
          xcodebuild -project cursor-buddy.xcodeproj \
            -scheme cursor-buddy \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          APP=$(ls -d build/Build/Products/Release/*.app | head -1)
          echo "Built: $APP"
          ditto -c -k --keepParent "$APP" OpenClicky-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClicky-unsigned
          path: OpenClicky-unsigned.zip
          if-no-files-found: error
